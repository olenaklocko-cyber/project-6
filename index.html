<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Спортивний Трекер</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <h1>Трекер «Мій ритм життя»</h1>
        </header>
        
        <main id="screens">
            <div id="screen-home" class="screen active"></div>
            <div id="screen-stats" class="screen"></div>
            <div id="screen-add" class="screen"></div>
            <div id="screen-profile" class="screen"></div>
        </main>
        
        <nav id="bottomNav">
            <button class="nav-btn active" data-screen="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">Головна</span>
            </button>
            <button class="nav-btn" data-screen="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-text">Статистика</span>
            </button>
            <button class="nav-btn" data-screen="add">
                <span class="nav-icon">➕</span>
                <span class="nav-text">Додати</span>
            </button>
            <button class="nav-btn" data-screen="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-text">Профіль</span>
            </button>
        </nav>
    </div>
    
    <script src="storage.js"></script>
    <script src="screens.js"></script>
    <script src="app.js"></script>
</body>
</html>
