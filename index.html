<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Спортивний Трекер</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=4.0">
</head>
<body>
    <div id="app">
        <header id="header">
            <h1 id="appTitle">Трекер «Мій ритм життя»</h1>
        </header>
        
        <main id="screens">
            <div id="screen-home" class="screen active">
                <!-- AI Scanner Card -->
                <div class="ai-scanner-card" id="aiScannerCard">
                    <div class="scanner-icon-container">
                        <div class="scanner-ring"></div>
                        <svg class="scanner-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                            <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                    </div>
                    <h2 class="scanner-title">Сфотографувати порцію</h2>
                    <p class="scanner-subtitle">Миттєвий AI-аналіз калорій за фото</p>
                </div>
            </div>
            <div id="screen-stats" class="screen"></div>
            <div id="screen-add" class="screen"></div>
            <div id="screen-profile" class="screen"></div>
        </main>
        
        <nav id="bottomNav">
            <button class="nav-btn active" data-screen="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-text" data-i18n="navHome">Головна</span>
            </button>
            <button class="nav-btn" data-screen="stats">
                <span class="nav-icon">📊</span>
                <span class="nav-text" data-i18n="navStats">Статистика</span>
            </button>
            <button class="nav-btn" data-screen="add">
                <span class="nav-icon">➕</span>
                <span class="nav-text" data-i18n="navAdd">Додати</span>
            </button>
            <button class="nav-btn" data-screen="profile">
                <span class="nav-icon">👤</span>
                <span class="nav-text" data-i18n="navProfile">Профіль</span>
            </button>
        </nav>
    </div>
    
    <script src="i18n.js"></script>
    <script src="storage.js"></script>
    <script src="screens.js"></script>
    <script src="app.js"></script>
</body>
</html>
